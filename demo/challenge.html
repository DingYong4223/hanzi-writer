<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>挑战 - Hanzi Writer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <h1 class="title">挑战模式</h1>

    <div id="challenge-app">
        <!-- Start screen -->
        <div id="start-screen">
            <p>共 10 关，每关写一个字</p>
            <p>每关有 3 次尝试机会</p>
            <button id="btn-start" class="btn-primary">开始挑战</button>
        </div>

        <!-- Game screen -->
        <div id="game-screen" style="display:none">
            <div id="game-header">
                <span id="level-info">第 1 / 10 关</span>
                <span id="attempts-info">剩余尝试: 3</span>
            </div>
            <div id="target"></div>
            <div id="game-actions">
                <button id="btn-retry" class="btn-warning">重试</button>
                <button id="btn-back-home">返回主页</button>
            </div>
            <div id="feedback" class="feedback"></div>
        </div>

        <!-- End screen -->
        <div id="end-screen" style="display:none">
            <p id="end-msg"></p>
            <button id="btn-restart" class="btn-primary">再来一次</button>
            <button id="btn-home">返回主页</button>
        </div>
    </div>

    <script src="../dist/hanzi-writer.js"></script>
    <script src="challenge.js"></script>
</body>
</html>
